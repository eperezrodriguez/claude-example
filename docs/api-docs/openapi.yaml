openapi: 3.0.3
info:
  title: Resttek API
  description: |
    API REST de Resttek, plataforma de gestión de restaurantes.

    Todas las rutas cuelgan de `/api/v1`, salvo `/health`.
    Los endpoints protegidos requieren una cabecera `Authorization: Bearer <token>`;
    el token se obtiene en `POST /auth/login`.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
tags:
  - name: Auth
    description: Inicio de sesión y registro de clientes
  - name: Empleados
    description: Gestión de empleados (solo administradores)
  - name: Restaurantes
    description: Gestión de restaurantes
  - name: Platos
    description: Carta de cada restaurante
  - name: Ingredientes
    description: Inventario de ingredientes de cada restaurante
  - name: Pedidos
    description: Pedidos y estado de sus líneas
  - name: Público
    description: Consulta sin autenticación para clientes
  - name: Sistema
    description: Estado del servicio
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: Devuelve un JWT y los datos del usuario. Sirve para empleados y clientes.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Credenciales incorrectas (`InvalidCredentialsError`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: InvalidCredentialsError, message: Invalid credentials }
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un cliente
      description: Crea un usuario con rol `cliente` y devuelve su JWT.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Cliente registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Datos inválidos o email ya en uso (`DuplicatedEmailError`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: DuplicatedEmailError, message: Email is already in use }
  /employees:
    post:
      tags: [Empleados]
      summary: Crear un empleado
      description: "Roles permitidos: `admin`."
      operationId: createEmployee
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmployeeInput' }
      responses:
        '201':
          description: Empleado creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400':
          description: Datos inválidos, rol inválido o email ya en uso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: DuplicatedEmailError, message: Email is already in use }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Empleados]
      summary: Listar empleados
      description: "Roles permitidos: `admin`. Paginado con `limit` y `offset`."
      operationId: listEmployees
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          description: Número máximo de resultados.
          schema: { type: integer, default: 10 }
        - name: offset
          in: query
          description: Número de resultados a saltar.
          schema: { type: integer, default: 0 }
        - name: role
          in: query
          description: Filtra por rol.
          schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Lista de empleados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employees/{id}:
    get:
      tags: [Empleados]
      summary: Obtener un empleado
      description: "Roles permitidos: `admin`."
      operationId: getEmployee
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Empleado encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /restaurants/{restaurantId}/employees:
    get:
      tags: [Empleados]
      summary: Listar los empleados de un restaurante
      description: "Roles permitidos: `admin`."
      operationId: listEmployeesByRestaurant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Empleados del restaurante.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /restaurants:
    post:
      tags: [Restaurantes]
      summary: Crear un restaurante
      description: "Roles permitidos: `admin`."
      operationId: createRestaurant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantInput' }
      responses:
        '201':
          description: Restaurante creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Restaurantes]
      summary: Listar restaurantes
      description: |
        Cualquier usuario autenticado. Un `admin` recibe todos los restaurantes; el resto de roles
        recibe solo el suyo (`restaurantId` del token), o una lista vacía si no tiene.
      operationId: listRestaurants
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de restaurantes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Restaurant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /restaurants/{id}:
    get:
      tags: [Restaurantes]
      summary: Obtener un restaurante
      description: Cualquier usuario autenticado.
      operationId: getRestaurant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Restaurante encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Restaurantes]
      summary: Actualizar un restaurante
      description: "Roles permitidos: `admin`. Sustituye todos los campos; si se omite `logoUrl` se guarda `null`."
      operationId: updateRestaurant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantInput' }
      responses:
        '200':
          description: Restaurante actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/restaurants:
    get:
      tags: [Público]
      summary: Listar todos los restaurantes (público)
      description: Sin autenticación. Lo usa la app de clientes para elegir restaurante.
      operationId: listPublicRestaurants
      security: []
      responses:
        '200':
          description: Lista de restaurantes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Restaurant' }
  /public/restaurants/{id}:
    get:
      tags: [Público]
      summary: Obtener un restaurante (público)
      description: Sin autenticación.
      operationId: getPublicRestaurant
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Restaurante encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '404': { $ref: '#/components/responses/NotFound' }
  /restaurants/{restaurantId}/dishes:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platos]
      summary: Crear un plato
      description: "Roles permitidos: `admin`, `manager`."
      operationId: createDish
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishInput' }
      responses:
        '201':
          description: Plato creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Platos]
      summary: Listar los platos de un restaurante
      description: "Roles permitidos: `admin`, `manager`, `camarero`, `cocinero`. Incluye los no disponibles."
      operationId: listDishes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Platos del restaurante.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dish' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /restaurants/{restaurantId}/dishes/{id}:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platos]
      summary: Obtener un plato
      description: "Roles permitidos: `admin`, `manager`, `camarero`, `cocinero`."
      operationId: getDish
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Plato encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dish' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Platos]
      summary: Actualizar un plato
      description: "Roles permitidos: `admin`, `manager`."
      operationId: updateDish
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DishInput' }
      responses:
        '200':
          description: Plato actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Platos]
      summary: Eliminar un plato
      description: "Roles permitidos: `admin`, `manager`."
      operationId: deleteDish
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Plato eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/restaurants/{restaurantId}/dishes:
    get:
      tags: [Público]
      summary: Carta pública de un restaurante
      description: Sin autenticación. Devuelve solo los platos con `available` verdadero.
      operationId: listPublicDishes
      security: []
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Platos disponibles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dish' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT devuelto por `POST /auth/login` o `POST /auth/register`.
  schemas:
    Restaurant:
      type: object
      required: [id, name, address, email, phone, ownerFirstName, ownerLastName, logoUrl, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Casa Pepe }
        address: { type: string, example: "Calle Mayor 1, Madrid" }
        email: { type: string, format: email, example: info@casapepe.com }
        phone: { type: string, example: "+34 600 123 456" }
        ownerFirstName: { type: string, example: Pepe }
        ownerLastName: { type: string, example: García }
        logoUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RestaurantInput:
      type: object
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name: { type: string }
        address: { type: string }
        email: { type: string, format: email }
        phone:
          type: string
          description: De 7 a 20 caracteres entre dígitos, espacios, guiones, paréntesis y un `+` inicial opcional.
          example: "+34 600 123 456"
        ownerFirstName: { type: string }
        ownerLastName: { type: string }
        logoUrl: { type: string, nullable: true, description: Si se omite se guarda `null`. }
    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
    DishIngredient:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: true, minimum: 0, description: Cantidad del ingrediente por ración. }
    Dish:
      type: object
      required: [id, name, description, price, category, available, restaurantId, ingredients, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Tortilla de patatas }
        description: { type: string, nullable: true }
        price: { type: number, format: double, example: 8.5 }
        category: { $ref: '#/components/schemas/DishCategory' }
        available: { type: boolean }
        restaurantId: { type: string, format: uuid }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/DishIngredient' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DishInput:
      type: object
      required: [name, price, category]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, format: double, exclusiveMinimum: true, minimum: 0 }
        category: { $ref: '#/components/schemas/DishCategory' }
        available: { type: boolean, description: Por defecto `true` al crear. }
        ingredients:
          type: array
          description: Por defecto lista vacía.
          items: { $ref: '#/components/schemas/DishIngredient' }
    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
    Ingredient:
      type: object
      required: [id, name, unit, currentStock, restaurantId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Patata }
        unit: { $ref: '#/components/schemas/IngredientUnit' }
        currentStock: { type: number, minimum: 0, example: 12.5 }
        restaurantId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IngredientInput:
      type: object
      required: [name, unit]
      properties:
        name: { type: string }
        unit: { $ref: '#/components/schemas/IngredientUnit' }
        currentStock: { type: number, minimum: 0, description: Por defecto 0 al crear. }
    Error:
      type: object
      description: |
        Cuerpo de error. Los errores de dominio (`errorHandler`) devuelven `error` con el nombre
        del error y `message`; los middlewares de autenticación y `/orders` devuelven solo `error`.
      required: [error]
      properties:
        error: { type: string, example: RestaurantNotFoundError }
        message: { type: string, example: Restaurant not found }
    OrderStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
    OrderItem:
      type: object
      description: Cada unidad pedida es una línea independiente con `quantity` 1, para seguir su estado por separado.
      required: [id, dishId, quantity, notes, status]
      properties:
        id: { type: string, format: uuid }
        dishId: { type: string, format: uuid }
        quantity: { type: integer, example: 1 }
        notes: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/OrderStatus' }
        dishName: { type: string, description: Solo al consultar pedidos. }
        dishPrice: { type: number, format: double, description: Solo al consultar pedidos. }
        dishCategory: { type: string, description: Solo al consultar pedidos. }
    Order:
      type: object
      required: [id, restaurantId, tableId, clientId, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        tableId: { type: string, nullable: true }
        clientId: { type: string, format: uuid, nullable: true, description: Id del usuario autenticado que creó el pedido. }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        restaurantName: { type: string, description: Solo al consultar pedidos. }
        restaurantLogoUrl: { type: string, nullable: true, description: Solo al consultar pedidos. }
    CreateOrderInput:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId: { type: string, format: uuid }
        tableId: { type: string, nullable: true }
        items:
          type: array
          description: "Una línea con `quantity: n` se expande en n líneas de cantidad 1."
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              notes: { type: string, nullable: true }
    UpdateOrderItemStatusInput:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
    Role:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]
    Employee:
      type: object
      description: "Representa a cualquier usuario del sistema, incluidos los clientes (`role: cliente`)."
      required: [id, firstName, lastName, email, role, restaurantId]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        restaurantId: { type: string, format: uuid, nullable: true, description: Es `null` para admin y cliente. }
    CreateEmployeeInput:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        role: { $ref: '#/components/schemas/Role' }
        restaurantId: { type: string, format: uuid, nullable: true, description: Si se omite se guarda `null`. }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@resttek.com }
        password: { type: string, format: password, example: admin@resttek.com }
    RegisterInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      required: [token, employee]
      properties:
        token: { type: string, description: JWT para la cabecera `Authorization`. }
        employee: { $ref: '#/components/schemas/Employee' }
  responses:
    BadRequest:
      description: Datos inválidos o error de validación de dominio (cualquier `AppError` que no sea 401/404).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: InvalidPhoneError, message: Invalid phone format }
    Unauthorized:
      description: Falta el token, está mal formado o no es válido (o, en el login, credenciales incorrectas).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "Unauthorized: No token provided" }
    Forbidden:
      description: El rol del usuario no tiene permiso para este endpoint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "Forbidden: Insufficient permissions" }
    NotFound:
      description: El recurso no existe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: RestaurantNotFoundError, message: Restaurant not found }
    InternalServerError:
      description: Error inesperado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: InternalServerError, message: Something went wrong }
