<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="listUrl" class="back-link">
        <lucide-icon name="chevron-left" [size]="18"></lucide-icon>
      </a>
      <h1>{{ pageTitle }}</h1>
    </div>
  </div>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="card form-card">
    <div class="form-grid">
      <div class="form-group">
        <label for="numero">Número</label>
        <input id="numero" type="number" class="form-control" [(ngModel)]="form.numero" name="numero" required min="1" step="1" />
      </div>

      <div class="form-group">
        <label for="capacidad">Capacidad</label>
        <input id="capacidad" type="number" class="form-control" [(ngModel)]="form.capacidad" name="capacidad" required min="1" step="1" />
      </div>

      <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado" class="form-control" [(ngModel)]="form.estado" name="estado" required>
          @for (s of statuses; track s) {
            <option [value]="s">{{ getStatusLabel(s) }}</option>
          }
        </select>
      </div>

      <div class="form-group form-full">
        <label for="descripcion">Descripción (opcional)</label>
        <textarea id="descripcion" class="form-control" [(ngModel)]="form.descripcion" name="descripcion" rows="3" placeholder="Terraza junto a la ventana"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <a [routerLink]="listUrl" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>
  </form>
</div>
